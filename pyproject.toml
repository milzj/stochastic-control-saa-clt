[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-control-saa-clt"
version = "0.1.0"
description = "Supplementary code for the manuscript: Central Limit Theorems for Sample Average Approximations in Stochastic Optimal Control"
readme = "README.md"
authors = [
    {name = "Johannes Milz"},
    {name = "Alexander Shapiro"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",
    "matplotlib",
    "scipy",
    "cvxpy"
]
